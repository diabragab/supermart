plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bm.supermarket'
    compileSdk 36

    defaultConfig {
        applicationId "com.bm.supermarket"
        minSdk 23
        targetSdk 36
        // CI passes the build number, so every upload to Google Play gets a higher versionCode
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        // Demo builds only: a fixed debug-type key committed to the repo so every CI build
        // has the same signature and installs as an update over the previous one.
        // Replace with a private release key (kept out of git) before publishing to Google Play.
        demo {
            storeFile file('demo-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Google Play upload key. Only exists in CI (GitHub secrets), never in git.
        if (System.getenv("BM_KEYSTORE_FILE")) {
            upload {
                storeFile file(System.getenv("BM_KEYSTORE_FILE"))
                storePassword System.getenv("BM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BM_KEY_ALIAS")
                keyPassword System.getenv("BM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
        release {
            minifyEnabled false
            // AAB for Google Play is signed with the upload key; APKs for testing keep the demo key
            signingConfig System.getenv("BM_KEYSTORE_FILE") ? signingConfigs.upload : signingConfigs.demo
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
