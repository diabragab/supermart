plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bm.supermarket'
    compileSdk 34

    defaultConfig {
        applicationId "com.bm.supermarket"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Demo build: signed with the debug key so it installs directly.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
