plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bm.supermarket'
    compileSdk 34

    defaultConfig {
        applicationId "com.bm.supermarket"
        minSdk 23
        targetSdk 34
        // CI passes -PbuildNumber=<run number> so every build is a newer version
        versionCode((project.findProperty('buildNumber') ?: '1') as int)
        versionName "1.0." + (project.findProperty('buildNumber') ?: '0')
    }

    signingConfigs {
        // Demo builds only: a fixed debug-type key committed to the repo so every CI build
        // has the same signature and installs as an update over the previous one.
        // Replace with a private release key (kept out of git) before publishing to Google Play.
        demo {
            storeFile file('demo-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // native "Sign in with Google" (account picker) → ID token for Firebase
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
