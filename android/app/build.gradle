plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bm.supermarket'
    compileSdk 34

    defaultConfig {
        applicationId "com.bm.supermarket"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0-demo"
    }

    signingConfigs {
        // Demo builds only: a fixed debug-type key committed to the repo so every CI build
        // has the same signature and installs as an update over the previous one.
        // Replace with a private release key (kept out of git) before publishing to Google Play.
        demo {
            storeFile file('demo-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
