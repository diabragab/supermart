<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c4a26">
<title>B&amp;M سوبر ماركت</title>
<style>
:root{
  --bg:#eef1ec;--surface:#fff;--sunk:#f3f5f1;--fg:#13241a;--muted:#5d6e62;--line:#dde3d8;
  --accent:#147a3e;--accent-ink:#fff;--deep:#0c4a26;--soft:#dcf2e2;
  --gold:#f4b400;--gold-ink:#3a2a00;--gold-soft:#fff4d1;
  --sale:#d1352b;--sale-soft:#fde4e1;--warn:#b86e00;--warn-soft:#fff0d6;--info:#2563eb;--info-soft:#dbe7fd;
  --shadow:0 10px 30px rgba(19,36,26,.16);
  --f:'Cairo','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0d140f;--surface:#16211a;--sunk:#1c2921;--fg:#e6efe8;--muted:#9aaba0;--line:#29392f;
  --accent:#2fb565;--accent-ink:#06210f;--deep:#0b2616;--soft:#183a26;
  --gold:#f4b400;--gold-ink:#2a1e00;--gold-soft:#3a2f10;
  --sale:#ff6b5e;--sale-soft:#3a1d1a;--warn:#f2a93b;--warn-soft:#3a2c12;--info:#7aa7ff;--info-soft:#1b2a45;
  --shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.55;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0}
#app{min-height:100%;display:flex;flex-direction:column}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:58px}
.top h1{font-size:18px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.12);color:#fff;position:relative}
.top .ib .dot{position:absolute;top:-4px;left:-4px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:900;border-radius:99px;min-width:18px;padding:0 4px;line-height:18px}
.logo{background:var(--accent);color:#fff;font-weight:900;border-radius:10px;padding:2px 9px;direction:ltr;font-size:17px;letter-spacing:.5px}
.logo i{font-style:normal;color:var(--gold)}
.main{flex:1;padding:14px 16px 96px}
/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0;position:relative;border-radius:12px}
.bnav button span{font-size:21px;line-height:1.2}
.bnav button.on{color:var(--accent)}
.bnav button.on span{background:var(--soft);border-radius:99px;padding:0 14px}
.bnav .dot{position:absolute;top:0;left:calc(50% - 22px);background:var(--sale);color:#fff;font-size:10.5px;font-weight:900;border-radius:99px;min-width:17px;line-height:17px;padding:0 4px}
/* common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:800}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec h2{font-size:17px;font-weight:800}
.sec a,.link{color:var(--accent);font-weight:800;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--sunk);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.red{background:var(--sale-soft);color:var(--sale);border-color:transparent}
.btn.blk{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13.5px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:800}
.t-green{background:var(--soft);color:var(--accent)}
.t-red{background:var(--sale-soft);color:var(--sale)}
.t-gold{background:var(--gold-soft);color:var(--warn)}
.t-blue{background:var(--info-soft);color:var(--info)}
.t-gray{background:var(--sunk);color:var(--muted)}
.search{position:relative}
.search input{padding-right:40px;border-radius:14px}
.search span{position:absolute;right:13px;top:50%;transform:translateY(-50%)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty div{font-size:52px}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;width:100%;text-align:start}
.ico{width:44px;height:44px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:24px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:21px;font-weight:900}
.kpi .d{font-size:12px;font-weight:700}
.up{color:var(--accent)}.dn{color:var(--sale)}
/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:3px;position:relative;text-align:start}
.pc .im{height:92px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:52px}
.pc b{font-size:14px;line-height:1.35;min-height:38px}
.pc .pr{display:flex;align-items:baseline;gap:6px}
.pc .pr strong{color:var(--accent);font-size:16px}
.pc .pr s{color:var(--muted);font-size:12.5px}
.pc .add{position:absolute;bottom:10px;left:10px;width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:900;display:grid;place-items:center}
.pc .off{position:absolute;top:14px;right:14px;background:var(--sale);color:#fff;font-size:11.5px;font-weight:900;border-radius:8px;padding:0 7px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pc{flex:none;width:150px}
.banner{border-radius:20px;padding:18px;background:linear-gradient(135deg,var(--accent),var(--deep));color:#fff;position:relative;overflow:hidden;min-height:132px}
.banner h3{font-size:21px;font-weight:900}
.banner p{margin:4px 0 10px;opacity:.9;font-size:14px}
.banner .big{position:absolute;left:12px;bottom:-8px;font-size:84px;opacity:.95}
.banner .btn{background:var(--gold);color:var(--gold-ink);border:0;padding:7px 14px;font-size:13.5px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700;text-align:center}
.cat span{width:62px;height:62px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:30px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.step button{width:36px;height:36px;font-size:20px;font-weight:900;color:var(--accent)}
.step b{min-width:34px;text-align:center}
/* sheet & modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,15,9,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:su .2s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;font-weight:900;margin-bottom:12px}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:90;max-width:90%;text-align:center;box-shadow:var(--shadow)}
.lbl{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px;display:block}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:start}
.opt.on{border-color:var(--accent);background:var(--soft)}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--deep) 0 300px,var(--bg) 300px)}
.login .hero{color:#fff;text-align:center;padding:48px 20px 26px}
.login .hero .logo{font-size:34px;padding:6px 18px;border-radius:16px;display:inline-block}
.login .hero p{opacity:.85;margin:10px 0 0}
.login .box{margin:0 16px;background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.demo{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;margin-top:14px}
.demo button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 4px;text-align:start;font-size:13.5px}
/* chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .bar{width:100%;max-width:34px;background:var(--accent);border-radius:7px 7px 3px 3px;min-height:3px}
.bars .bar.hl{background:var(--gold)}
.bars .bc small{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.hbar{height:9px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
/* POS */
.pos-scan{display:flex;gap:8px}
.pos-scan input{border:2px solid var(--accent);font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px;display:flex;flex-direction:column;gap:1px;text-align:start;position:relative}
.tile:active{transform:scale(.96);border-color:var(--accent)}
.tile .e{height:48px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:28px}
.tile b{font-size:12.5px;line-height:1.3;min-height:33px}
.tile .p{color:var(--accent);font-weight:800;font-size:13.5px}
.tile .s{font-size:11px;color:var(--muted);font-weight:700}
.tile .s.low{color:var(--sale)}
.tile .kg{position:absolute;top:10px;left:10px;background:var(--info-soft);color:var(--info);font-size:10.5px;font-weight:800;border-radius:6px;padding:0 5px}
.posbar{position:fixed;bottom:64px;left:12px;right:12px;z-index:25;background:var(--deep);color:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.posbar .btn{border:0}
.inv-l{display:flex;align-items:center;gap:8px;padding:9px 0}
.inv-l .n{flex:1;min-width:0}
.inv-l .n b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.big{font-size:20px;font-weight:900;border-top:2px dashed var(--line);padding-top:8px;margin-top:4px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:20px;font-weight:800}
.receipt{background:#fff;color:#111;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;padding:16px 14px;border-radius:6px;max-width:300px;margin:0 auto;direction:rtl;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:6px}
.bcode{height:40px;margin:8px auto 2px;width:80%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 3px,#111 3px 4px,#fff 4px 7px,#111 7px 8px,#fff 8px 9px)}
.offline-pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:800}
/* order tracking */
.track{display:flex;flex-direction:column;gap:0;margin:8px 0}
.track .s{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.track .s:not(:last-child)::after{content:"";position:absolute;right:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.track .s.done:not(:last-child)::after{background:var(--accent)}
.track .c{width:28px;height:28px;border-radius:50%;background:var(--sunk);border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none;z-index:1}
.track .done .c{background:var(--accent);border-color:var(--accent);color:#fff}
.track .cur .c{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.fab{position:fixed;bottom:80px;left:18px;z-index:26;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:28px;font-weight:900;box-shadow:var(--shadow)}
.menu .li span:last-child{color:var(--muted)}
.splash{position:fixed;inset:0;z-index:99;background:var(--deep);display:grid;place-items:center;transition:opacity .4s}
.splash .logo{font-size:44px;padding:8px 24px;border-radius:20px}
.av{width:44px;height:44px;border-radius:50%;background:var(--gold-soft);color:var(--warn);display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
/* ===== motion ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}70%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(244,180,0,.55),var(--shadow)}50%{box-shadow:0 0 0 12px rgba(244,180,0,0),var(--shadow)}}
.main{animation:fadeUp .3s ease-out}
.anim>*{animation:pop .42s cubic-bezier(.2,.8,.3,1.2) both}
.anim>*:nth-child(1){animation-delay:.02s}.anim>*:nth-child(2){animation-delay:.06s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.14s}.anim>*:nth-child(5){animation-delay:.18s}.anim>*:nth-child(6){animation-delay:.22s}.anim>*:nth-child(7){animation-delay:.26s}.anim>*:nth-child(8){animation-delay:.3s}.anim>*:nth-child(n+9){animation-delay:.34s}
.pc .off{animation:pulse 1.6s ease-in-out infinite}
.pc:active{transform:scale(.97)}
.pc .add{transition:transform .15s}.pc .add:active{transform:scale(.8)}
.bnav .dot.bump{animation:bump .5s ease}
.cat span{transition:transform .2s}.cat:active span{transform:scale(.9) rotate(-6deg)}
.flyer{position:fixed;z-index:95;font-size:34px;pointer-events:none}
.conf{position:fixed;top:-20px;z-index:96;width:10px;height:14px;border-radius:3px;pointer-events:none}
/* carousel */
.carousel{position:relative;overflow:hidden;border-radius:20px;margin-top:14px}
.slides{display:flex;transition:transform .55s cubic-bezier(.6,0,.2,1)}
.slides .banner{flex:0 0 100%;border-radius:0}
.banner::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:shine 3.5s ease-in-out infinite}
.banner .big{animation:floaty 2.6s ease-in-out infinite}
.banner.b2{background:linear-gradient(135deg,#f4b400,#e0701b)}
.banner.b2 .btn{background:#0c4a26;color:#fff}
.banner.b3{background:linear-gradient(135deg,#2563eb,#0c4a26)}
.dots{position:absolute;bottom:8px;right:0;left:0;display:flex;justify-content:center;gap:5px;z-index:2}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.5);transition:all .3s}
.dots i.on{width:20px;background:#fff}
/* wheel */
.wheel-fab{position:fixed;bottom:84px;left:16px;z-index:26;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd54a,#f4b400 60%,#d48f00);font-size:32px;display:grid;place-items:center;animation:glow 1.8s infinite}
.wheel-fab span{display:inline-block;animation:spinSlow 6s linear infinite}
.wheel-fab b{position:absolute;top:-8px;right:-6px;background:var(--sale);color:#fff;font-size:10.5px;border-radius:99px;padding:0 6px;line-height:18px;animation:wiggle 1.6s ease-in-out infinite}
.wheel-wrap{position:relative;width:300px;max-width:84vw;aspect-ratio:1;margin:6px auto 14px}
.wheel-wrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.25))}
.wheel-rot{transform-origin:150px 150px;transition:transform 5.2s cubic-bezier(.12,.75,.12,1)}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--sale);filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));z-index:2}
.pointer.tick{animation:wiggle .15s}
.hub{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid var(--gold);display:grid;place-items:center;font-weight:900;color:var(--deep);font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.25);direction:ltr}
.coupon{display:flex;align-items:center;gap:10px;border:2px dashed var(--gold);background:var(--gold-soft);border-radius:14px;padding:10px 12px}
.prize{font-size:30px;font-weight:900;color:var(--accent);animation:pop .5s cubic-bezier(.2,.8,.3,1.4)}
.splash .logo{animation:pop .7s cubic-bezier(.2,.8,.3,1.5)}
.splash .cartgo{font-size:40px;display:inline-block;animation:drive 1.3s ease-in-out .2s both}
@keyframes drive{from{transform:translateX(160px);opacity:0}30%{opacity:1}to{transform:translateX(-160px);opacity:0}}
.splash .tag2{color:#cfe9d8;margin-top:12px;font-weight:700;animation:fadeUp .5s .35s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:760px){
  .main{max-width:1100px;margin:0 auto;width:100%}
  .cats{grid-template-columns:repeat(8,1fr)}
  .grid2.k4{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}

function sha256(m){function r(n,x){return(x>>>n)|(x<<(32-n))}const K=[],H=[];let p=2;for(let c=0;c<64;p++){let ok=1;for(let i=2;i*i<=p;i++)if(p%i===0){ok=0;break}if(ok){if(c<8)H[c]=(Math.pow(p,1/2)*4294967296)|0;K[c++]=(Math.pow(p,1/3)*4294967296)|0}}
  const b=unescape(encodeURIComponent(m));const w=[];const l=b.length*8;for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);w[l>>5]|=0x80<<(24-l%32);w[((l+64>>9)<<4)+15]=l;
  for(let j=0;j<w.length;j+=16){const W=[];let[a,bb,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){if(i<16)W[i]=w[j+i]|0;else{const x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(r(7,x)^r(18,x)^(x>>>3))+W[i-7]+(r(17,y)^r(19,y)^(y>>>10)))|0}
   const t1=(h+(r(6,e)^r(11,e)^r(25,e))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((r(2,a)^r(13,a)^r(22,a))+((a&bb)^(a&c)^(bb&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
   H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
const pwHash=(id,p)=>sha256("bm:"+id+":"+p);
const pwOk=(acc,id,p)=>acc.ph?acc.ph===pwHash(id,p):acc.pass===p;
const CFG=window.BM_FIREBASE||{};

const dbUrl=p=>`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(CFG.projectId)}/databases/(default)/documents/${p}?${CFG.apiKey?"key="+encodeURIComponent(CFG.apiKey):""}`;
function fetchT(u,o){const c=new AbortController();const t=setTimeout(()=>c.abort(),7000);return fetch(u,Object.assign({signal:c.signal},o||{})).finally(()=>clearTimeout(t))}
function toF(o){const f={};for(const k in o){const v=o[k];if(v==null)continue;if(typeof v==="number")f[k]=Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};else if(typeof v==="boolean")f[k]={booleanValue:v};else if(Array.isArray(v))f[k]={arrayValue:{values:v.map(x=>({stringValue:String(x)}))}};else f[k]={stringValue:String(v)}}return{fields:f}}
function fromF(d){const o={},f=d.fields||{};for(const k in f){const v=f[k];o[k]=v.stringValue!==undefined?v.stringValue:v.integerValue!==undefined?+v.integerValue:v.doubleValue!==undefined?v.doubleValue:v.booleanValue!==undefined?v.booleanValue:v.arrayValue?(v.arrayValue.values||[]).map(x=>x.stringValue):null}return o}
async function dbList(col){const r=await fetchT(dbUrl(col)+"&pageSize=1000");if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();return(j.documents||[]).map(fromF)}
async function dbGet(col,id){const r=await fetchT(dbUrl(col+"/"+encodeURIComponent(id)));if(r.status===404)return null;if(!r.ok)throw new Error("HTTP "+r.status);return fromF(await r.json())}
async function dbPut(col,id,o){const r=await fetchT(dbUrl(col+"/"+encodeURIComponent(id)),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(toF(o))});if(!r.ok)throw new Error("HTTP "+r.status)}
const pubCust=c=>({phone:c.phone,name:c.name,addr:c.addr||[],pts:c.pts||0,since:c.since||Date.now(),ph:c.ph||pwHash(c.phone,c.pass)});
const pubStaff=u=>({u:u.u,name:u.name,role:u.role,ph:u.ph||pwHash(u.u,u.pass)});
function mergeCust(rc){const l=S.customers.find(c=>c.phone===rc.phone);if(l&&l.dirty)return;if(l){Object.assign(l,rc);delete l.pass}else S.customers.push(rc)}
function mergeStaff(ru){const l=S.users.find(u=>u.u===ru.u);if(l&&l.dirty)return;if(l){Object.assign(l,ru);delete l.pass}else S.users.push(ru)}
function markDirty(acc){acc.dirty=true;save();pushDirty()}
async function pushDirty(){
  if(!DB.on)return;
  try{
    for(const c of S.customers.filter(x=>x.dirty)){await dbPut("customers",c.phone,pubCust(c));c.ph=c.ph||pwHash(c.phone,c.pass);delete c.dirty}
    for(const u of S.users.filter(x=>x.dirty)){await dbPut("staff",u.u,pubStaff(u));u.ph=u.ph||pwHash(u.u,u.pass);delete u.dirty}
    DB.status="online";DB.last=Date.now();
  }catch(e){DB.status="error"}
  save();
}
async function syncAccounts(manual){
  if(!DB.on){if(manual)toast("قاعدة البيانات الأونلاين مش متظبطة لسه");return}
  if(DB.busy)return;DB.busy=true;
  try{
    await pushDirty();
    const[cs,us]=await Promise.all([dbList("customers"),dbList("staff")]);
    if(!us.length){ /* first run: upload demo accounts */
      await Promise.all([...S.users.map(u=>dbPut("staff",u.u,pubStaff(u))),...S.customers.map(c=>dbPut("customers",c.phone,pubCust(c)))]);
      S.users.forEach(u=>{u.ph=pubStaff(u).ph;delete u.pass});S.customers.forEach(c=>{c.ph=pubCust(c).ph;delete c.pass});
    }else{cs.forEach(mergeCust);us.forEach(mergeStaff)}
    DB.status="online";DB.last=Date.now();
    if(manual)toast(`🔄 اتزامن: ${S.customers.length} عميل • ${S.users.length} موظف`);
  }catch(e){DB.status="error";if(manual)toast("📴 مش قادر يوصل لقاعدة البيانات – شغال على الموبايل")}
  DB.busy=false;save();
  if(S.session&&["customers","staff","settings"].includes(R.tab))render();
}
/* fetch a single account fresh from the server before login / register */
async function fetchAcc(id){
  if(!DB.on)return;
  try{
    const isPhone=/^01\d{9}$/.test(id);
    const d=await dbGet(isPhone?"customers":"staff",id);
    if(d)(isPhone?mergeCust:mergeStaff)(d);
    DB.status="online";return d;
  }catch(e){DB.status="error"}
}

function posAdd(id,q){
  const p=prod(id);

  if(p.st<=0)toast(`⚠️ ${p.n} رصيده صفر في السيستم`);
  const l=!p.kg&&P_().lines.find(x=>x.id===id);
  if(l)l.q+=q;else P_().lines.push({id,q});
  beep();vib();posQ="";render();toast(`✓ ${p.n}`);
}
function weightSheet(p){
  let v="";

   <div class="keypad">${[1,2,3,4,5,6,7,8,9,".",0,"⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div>
   <div class="row" style="margin-top:10px"><button class="btn sp" id="scale">⚖️ قراءة من الميزان</button><button class="btn pri sp" id="wok">إضافة</button></div>`);

  s.querySelector("#wok").onclick=()=>{const w=+v;if(!w)return toast("اكتب الوزن");closeSheet();posAdd(p.id,w)};
}
function scan(v){
  v=(v||"").trim();if(!v)return;

  if(p)return posAdd(p.id,p.kg?null:1);
  const m=S.products.filter(x=>x.n.includes(v));
  if(m.length===1)return posAdd(m[0].id,m[0].kg?null:1);
  if(m.length>1){posQ=v;$("#tiles").innerHTML=posTiles();return toast(`${m.length} أصناف مطابقة`)}

function paySheet(){
  const tot=posTot();let method="cash",given="";
  const s=sheet(`<h2>الدفع – ${fmt(tot)}</h2>
   <div class="seg" style="margin-bottom:12px"><button class="on" data-m="cash">💵 كاش</button><button data-m="visa">💳 فيزا</button><button data-m="split">➗ مقسّم</button></div>
   <div id="pb"></div><button class="btn pri blk" style="margin-top:12px" id="pok">تأكيد وطباعة الفاتورة 🖨️</button>`);
  const body=()=>{
    const pb=s.querySelector("#pb");
    if(method==="cash"){const quick=[...new Set([tot,Math.ceil(tot/10)*10,Math.ceil(tot/50)*50,Math.ceil(tot/100)*100,Math.ceil(tot/200)*200])].slice(0,4);
      pb.innerHTML=`<label class="lbl">المبلغ المدفوع</label><input id="gv" type="number" inputmode="decimal" value="${given}" placeholder="${tot}"><div class="chips" style="margin-top:8px">${quick.map(q=>`<button class="chip" data-g="${q}">${fmt0(q)}</button>`).join("")}</div><div class="card row" style="margin-top:10px;background:var(--soft);border-color:transparent"><b class="sp">الباقي للعميل</b><b id="chg" style="font-size:22px">0 ج.م</b></div>`;
      const ch=()=>{given=s.querySelector("#gv").value;const c=(+given||tot)-tot;s.querySelector("#chg").textContent=c>=0?fmt(c):"المبلغ ناقص"};
      pb.querySelector("#gv").oninput=ch;pb.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{s.querySelector("#gv").value=b.dataset.g;ch()});ch();
    }else if(method==="visa")pb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">💳</div><b>مرّر الكارت على جهاز الفيزا</b><div class="sm muted">المبلغ: ${fmt(tot)}</div></div>`;
    else pb.innerHTML=`<label class="lbl">كاش</label><input id="sc" type="number" value="${r2(tot/2)}"><label class="lbl" style="margin-top:8px">فيزا</label><input id="sv" type="number" value="${r2(tot-r2(tot/2))}" readonly>`,pb.querySelector("#sc").oninput=e=>{pb.querySelector("#sv").value=r2(tot-(+e.target.value||0))};
  };
  s.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{method=b.dataset.m;s.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x===b));body()});
  body();
  s.querySelector("#pok").onclick=()=>{
    if(method==="cash"&&given&&+given<tot)return toast("المبلغ المدفوع أقل من الإجمالي");
    let splitCash=0;if(method==="split"){splitCash=r2(+s.querySelector("#sc").value||0);if(splitCash<0||splitCash>tot)return toast("مبلغ الكاش لازم يكون بين 0 والإجمالي")}
    const ps=P_();
    const items=ps.lines.map(l=>{const p=prod(l.id);return{id:p.id,n:p.n,e:p.e,q:l.q,p:price(p),cost:p.cost}});
    items.forEach(i=>{const p=prod(i.id);p.st=r2(Math.max(0,p.st-i.q))});
    const inv={id:++S.invNo,t:Date.now(),items,sub:posSub(),disc:ps.disc,total:tot,pay:method,given:method==="cash"?(+given||tot):null,cashPart:method==="cash"?tot:method==="split"?splitCash:0,cashier:S.session.name,synced:S.online,ret:false};
    S.sales.push(inv);if(!S.online)S.queue.push(inv.id);
    ps.lines=[];ps.disc=0;closeAll();render();receiptSheet(inv,true);
  };
}

function orderNext(id){
  const o=S.orders.find(x=>x.id===id);if(o.st<0||o.st>=3)return;
  const short=o.items.find(i=>{const p=prod(i.id);return p&&p.st<i.q});
  if(o.st===0&&short){const p=prod(short.id);return toast(`⚠️ المخزون مش كفاية: ${p.n} (المتاح ${qty(p,p.st)})`)}
  o.st++;
  if(o.st===3){o.items.forEach(i=>{const p=prod(i.id);if(p)p.st=r2(Math.max(0,p.st-i.q))});S.sales.push({id:++S.invNo,t:Date.now(),items:o.items.map(i=>Object.assign({cost:(prod(i.id)||{}).cost},i)),sub:o.total,disc:0,total:o.total,pay:o.pay,cashier:"طلب أونلاين "+o.id,synced:true,ret:false,online:o.id})}
  toast(`${o.id}: ${o.type==="pickup"&&o.st===2?"جاهز للاستلام":ST[o.st]}`);render();
}

}

   <div><label class="lbl">الباركود</label><input id="e_bc" class="ltr" placeholder="622..." inputmode="numeric"></div>
   <div><label class="lbl">القسم</label><select id="e_c">${CATS.map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></div>
   <div class="grid2"><div><label class="lbl">الرصيد الافتتاحي</label><input id="e_st" type="number" value="0"></div><div><label class="lbl">بيع بالوزن؟</label><select id="e_kg"><option value="">لا – بالقطعة</option><option value="1">نعم – بالكيلو</option></select></div></div>`}

   <div class="grid2"><div><label class="lbl">سعر العرض (اختياري)</label><input id="e_off" type="number" inputmode="decimal" value="${p.offer||""}"></div><div><label class="lbl">حد إعادة الطلب</label><input id="e_min" type="number" value="${p.min}"></div></div>
   <button class="btn pri blk" id="esave">حفظ</button>${id?`<button class="btn blk" data-a="po" data-v="${p.id}">📝 طلب توريد من المورد</button>`:""}</div>`);
  s.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{const i=s.querySelector("#e_st");i.value=Math.max(0,r2((+i.value||0)+ +b.dataset.adj))});
  s.querySelector("#esave").onclick=()=>{
    const g=k=>{const e=s.querySelector("#e_"+k);return e?e.value:null};
    if(!id){if(!g("n").trim())return toast("اكتب اسم المنتج");if(g("bc")&&S.products.some(x=>x.bc===g("bc").trim()))return toast("الباركود ده متسجل لمنتج تاني");p.id=Math.max(...S.products.map(x=>x.id))+1;p.n=g("n").trim();p.e=g("e")||"🛒";p.bc=(g("bc")||"").trim()||("BM"+p.id);p.c=g("c");p.kg=!!g("kg");S.products.push(p)}

    if(p.offer&&p.offer>=p.p)p.offer=null;

let rp=7;
function aReports(){
  const from=startOf(rp-1);
  const ss=S.sales.filter(s=>s.t>=from&&!s.ret);
  const tot=ss.reduce((a,s)=>a+s.total,0);
  const cost=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.cost||i.p*.85)*i.q,0),0);
  const days=[...Array(Math.min(rp,14))].map((_,i)=>{const d=Math.min(rp,14)-1-i;return{d,v:S.sales.filter(s=>s.t>=startOf(d)&&s.t<startOf(d-1)&&!s.ret).reduce((a,s)=>a+s.total,0)}});
  const mx=Math.max(...days.map(x=>x.v),1);
  const byCat={};const byP={};
  ss.forEach(s=>s.items.forEach(i=>{const p=prod(i.id);if(!p)return;byCat[p.c]=(byCat[p.c]||0)+i.p*i.q;byP[i.id]=(byP[i.id]||0)+i.p*i.q}));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const cm=cats.length?cats[0][1]:1;
  const top=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const cash=ss.reduce((a,s)=>a+(s.cashPart!=null?s.cashPart:s.pay==="cash"?s.total:0),0);
  const onl=ss.filter(s=>s.online).reduce((a,s)=>a+s.total,0);
  const hours=[...Array(14)].map((_,i)=>ss.filter(s=>new Date(s.t).getHours()===i+9).length);const hm=Math.max(...hours,1);
  return aTop("التقارير")+`<main class="main"><div class="chips" style="margin-bottom:12px">${[[1,"النهارده"],[7,"آخر 7 أيام"],[14,"آخر 14 يوم"]].map(([k,n])=>`<button class="chip ${rp===k?"on":""}" data-a="rp" data-v="${k}">${n}</button>`).join("")}<button class="chip" data-a="export">⬇️ تصدير Excel</button></div>
   <div class="grid2 k4"><div class="kpi"><div class="l">إجمالي المبيعات</div><div class="v num" style="font-size:18px">${fmt(tot)}</div></div><div class="kpi"><div class="l">صافي الربح التقديري</div><div class="v num up" style="font-size:18px">${fmt(tot-cost)}</div></div><div class="kpi"><div class="l">عدد الفواتير</div><div class="v num" style="font-size:18px">${ss.length}</div></div><div class="kpi"><div class="l">متوسط الفاتورة</div><div class="v num" style="font-size:18px">${fmt(ss.length?tot/ss.length:0)}</div></div></div>
   ${rp>1?`<div class="card" style="margin-top:12px"><b>المبيعات اليومية</b><div class="bars">${days.map(x=>`<div class="bc"><div class="bar ${x.d===0?"hl":""}" style="height:${x.v/mx*100}%"></div><small>${new Date(startOf(x.d)).getDate()}</small></div>`).join("")}</div></div>`:""}
   <div class="card" style="margin-top:12px"><b>ساعات الذروة</b><div class="bars" style="height:110px">${hours.map((h,i)=>`<div class="bc"><div class="bar ${h===hm?"hl":""}" style="height:${h/hm*100}%"></div><small>${(i+9)%12||12}</small></div>`).join("")}</div></div>
   <div class="card" style="margin-top:12px"><b>المبيعات حسب القسم</b>${cats.map(([k,v])=>{const c=CATS.find(x=>x[0]===k);return `<div style="margin-top:10px"><div class="row sm"><span>${c[2]} ${c[1]}</span><span class="sp"></span><b>${fmt(v)}</b></div><div class="hbar"><i style="width:${v/cm*100}%"></i></div></div>`}).join("")}</div>
   <div class="card" style="margin-top:12px"><b>أكتر 5 أصناف مبيعاً</b><div class="list">${top.map(([id,v],i)=>{const p=prod(id);return `<div class="li"><b style="width:20px;color:var(--muted)">${i+1}</b><span class="ico">${p.e}</span><span class="sp sm b">${esc(p.n)}</span><b class="sm">${fmt(v)}</b></div>`}).join("")}</div></div>
   <div class="card" style="margin-top:12px"><b>طرق الدفع والقنوات</b>
    <div style="margin-top:10px"><div class="row sm"><span>💵 كاش</span><span class="sp"></span><b>${fmt(cash)} (${tot?Math.round(cash/tot*100):0}%)</b></div><div class="hbar"><i style="width:${tot?cash/tot*100:0}%"></i></div></div>
    <div style="margin-top:10px"><div class="row sm"><span>💳 فيزا</span><span class="sp"></span><b>${fmt(tot-cash)}</b></div><div class="hbar"><i style="width:${tot?(tot-cash)/tot*100:0}%;background:var(--info)"></i></div></div>
    <div style="margin-top:10px"><div class="row sm"><span>🛵 طلبات أونلاين</span><span class="sp"></span><b>${fmt(onl)}</b></div><div class="hbar"><i style="width:${tot?onl/tot*100:0}%;background:var(--gold)"></i></div></div></div>
  </main>`;
}

function wheelSVG(){

    g+=`<path d="M${R},${R} L${x0},${y0} A${R},${R} 0 0,1 ${x1},${y1} Z" fill="${p.c}" stroke="#fff" stroke-width="3"/>`;
    g+=`<g transform="rotate(${i*a} ${R} ${R})"><text x="${R}" y="48" text-anchor="middle" fill="#fff" font-size="15" font-weight="900" font-family="Cairo,Tahoma,sans-serif">${p.l.split(" ")[0]}</text><text x="${R}" y="68" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Cairo,Tahoma,sans-serif">${p.l.split(" ").slice(1).join(" ")}</text></g>`});

  if(b.dataset.a==="addcart")e.stopPropagation();
  const f=A[b.dataset.a];if(f){e.preventDefault();f(b.dataset.v,b)}
},false);
document.addEventListener("input",e=>{
  if(e.target.id==="q")searchResults(e.target.value);
  if(e.target.id==="iq"){invQ=e.target.value;$("#il").innerHTML=invList()}
  if(e.target.id==="scan"){posQ=e.target.value;$("#tiles").innerHTML=posTiles()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="scan"){e.preventDefault();scan(e.target.value)}
  if(e.key==="Enter"&&(e.target.id==="l_pass"||e.target.id==="l_user")){e.preventDefault();(loginMode==="reg"?A.register:A.login)()}
});
/* inner click on product card's add button must not open sheet */
document.addEventListener("click",e=>{},true);
const _render=render;
render=function(){_render();startCarousel();if(R.tab==="search")setTimeout(()=>{const q=$("#q");if(q){searchResults(q.value);q.focus()}},0)};
render();
syncAccounts();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncAccounts()});
setTimeout(()=>{const s=$("#splash");s.style.opacity=0;s.style.transform="scale(1.08)";s.style.transition="opacity .45s,transform .45s";setTimeout(()=>s.remove(),450)},1500);
</script>
</body>
