name: Build Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stamp build number (used by the in-app update check)
        run: |
          if [ "$GITHUB_REF_NAME" = "android-demo-app" ]; then CH=demo; else CH="${GITHUB_REF_NAME//\//-}"; fi
          echo "window.BM_BUILD={n:${{ github.run_number }},ch:\"$CH\"};" > android/app/src/main/assets/www/build.js
          cat android/app/src/main/assets/www/build.js

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BM-Supermarket-demo.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/android-demo-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="demo-v1.0.${{ github.run_number }}"
          gh release create "$TAG" BM-Supermarket-demo.apk \
            --target "${{ github.sha }}" \
            --title "B&M Supermarket – Android demo (build ${{ github.run_number }})" \
            --notes "نسخة عرض تجريبية من تطبيق B&M. نزّل ملف BM-Supermarket-demo.apk على الموبايل وثبّته (فعّل التثبيت من مصادر غير معروفة). حسابات العرض: admin / 1234 ، cashier / 1234 ، store / 1234 ، عميل 01000000000 / 1234."

      - name: Publish pre-release (other branches, never "latest")
        if: github.ref != 'refs/heads/android-demo-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME//\//-}-v1.0.${{ github.run_number }}"
          gh release create "$TAG" BM-Supermarket-demo.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "B&M Supermarket – ${GITHUB_REF_NAME} (build ${{ github.run_number }})" \
            --notes "نسخة تجريبية من فرع ${GITHUB_REF_NAME}."

      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: BM-Supermarket-demo-apk
          path: BM-Supermarket-demo.apk
