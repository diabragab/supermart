name: Fetch product image candidates
on: {push: {branches: [img-fetch2]}}
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: cd imgfetch && python fetch.py
      - run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add imgfetch/out && git commit -qm "image candidates" && git push
